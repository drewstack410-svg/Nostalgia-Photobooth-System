<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3d2b1f" />
    <title>Nostalgia Photobooth</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <!-- Brand wordmark artwork replaces the typed title so the page
             carries the real logo, matching the booth. -->
        <img
          src="Logo.svg"
          alt="Nostalgia Photobooth"
          class="intro-logo"
          width="900"
          height="236"
        />
        <h1 id="title" class="intro-title sr-only">Nostalgia Photobooth</h1>
        <p class="intro-subtitle">Your photos are ready</p>
      </header>

      <div class="stage" id="stage">
        <button class="stage-share-btn" id="shareBtn" aria-label="Share">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
        <div class="stage-inner" id="stageInner"></div>
        <div class="stage-loading" id="loading" hidden>Loading…</div>
        <div class="stage-error" id="error" hidden>
          <p>Couldn't load this — try again in a moment.</p>
        </div>
      </div>

      <div class="filmstrip" id="filmstrip" hidden></div>

      <div class="tabs" id="tabs" role="tablist" aria-label="View"></div>

      <button class="save-btn" id="saveBtn">
        <span id="saveBtnLabel">Save to Camera Roll</span>
      </button>

      <button class="individual-link" id="individualToggle">
        <span aria-hidden="true">✂</span> save individual photos
      </button>

      <div class="individual-panel" id="individualPanel" hidden></div>

      <footer class="footnote" id="footnote"></footer>
    </main>

    <!-- GIF encoder parked — Highlight tab plays booth-recorded video instead.
    <script src="./gif.js"></script>
    -->
    <script src="./app.js"></script>
  </body>
</html>
