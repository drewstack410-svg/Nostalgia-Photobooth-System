<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad)"/>
  
  <!-- Camera Body -->
  <rect x="120" y="180" width="272" height="180" rx="20" fill="white"/>
  
  <!-- Flash -->
  <rect x="160" y="150" width="60" height="30" rx="5" fill="white"/>
  
  <!-- Lens Outer -->
  <circle cx="256" cy="270" r="70" fill="#1a1a2e"/>
  
  <!-- Lens Middle -->
  <circle cx="256" cy="270" r="50" fill="#302b63"/>
  
  <!-- Lens Inner -->
  <circle cx="256" cy="270" r="30" fill="#667eea"/>
  
  <!-- Lens Shine -->
  <circle cx="240" cy="255" r="12" fill="white" opacity="0.6"/>
  
  <!-- Shutter Button -->
  <circle cx="340" cy="200" r="15" fill="#e53e3e"/>
</svg>
